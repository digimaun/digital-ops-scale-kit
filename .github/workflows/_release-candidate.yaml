# Read-only release preparation shared by publication and CI rehearsals.
name: _Release Candidate

on:
  workflow_call:
    inputs:
      expected-source-sha:
        required: true
        type: string
      intent:
        required: false
        type: string
        default: ""
      before-sha:
        required: false
        type: string
        default: ""
      dry-run:
        required: false
        type: boolean
        default: false
    outputs:
      active:
        value: ${{ jobs.prepare.outputs.active }}
      tag:
        value: ${{ jobs.prepare.outputs.tag }}
      bundle:
        value: ${{ jobs.prepare.outputs.bundle }}
      plan-artifact-id:
        value: ${{ jobs.prepare.outputs.artifact-id }}
      plan-sha:
        value: ${{ jobs.review.outputs.plan-sha }}
      notes-sha:
        value: ${{ jobs.review.outputs.notes-sha }}
      bundle-sha:
        value: ${{ jobs.review.outputs.bundle-sha }}
      wheel-name:
        value: ${{ jobs.review.outputs.wheel-name }}
      wheel-sha:
        value: ${{ jobs.review.outputs.wheel-sha }}
      asset-list-sha:
        value: ${{ jobs.review.outputs.asset-list-sha }}
      bundle-artifact-id:
        value: ${{ jobs.distribution.outputs.staging-artifact-id }}
      assets-artifact-id:
        value: ${{ jobs.review.outputs.assets-artifact-id }}
      build-number:
        value: ${{ jobs.distribution.outputs.build-number }}
      build-attempt:
        value: ${{ jobs.distribution.outputs.build-attempt }}
      engine-id:
        value: ${{ jobs.review.outputs.engine-id }}
      engine-ref:
        value: ${{ jobs.review.outputs.engine-ref }}
      notes-artifact-id:
        value: ${{ jobs.review.outputs.notes-artifact-id }}

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}
  SOURCE_REF: ${{ github.ref }}
  ARCHIVE_NAME: siteops-install.zip
  ATTESTATION_SUFFIX: .attestation.jsonl
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  PREDICATE_TYPE: https://slsa.dev/provenance/v1
  SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/_siteops-distribution.yaml@${{ github.ref }}
  PYTHONDONTWRITEBYTECODE: "1"
  DRY_RUN: ${{ inputs.dry-run }}

jobs:
  prepare:
    name: Read the release file
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      active: ${{ steps.plan.outputs.active }}
      tag: ${{ steps.plan.outputs.tag }}
      bundle: ${{ steps.plan.outputs.bundle }}
      version-mode: ${{ steps.plan.outputs.version-mode }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Confirm the source request
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected-source-sha }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != "true" && "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::Release candidates must be prepared from main."
            exit 1
          fi
          if [[ "$EXPECTED_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::The selected branch no longer points to the requested commit."
            exit 1
          fi

      - name: Checkout the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install declaration tooling
        shell: bash
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/
          PIP_EXTRA_INDEX_URL: ""
          PIP_NO_INPUT: "1"
          PIP_KEYRING_PROVIDER: disabled
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          umask 077
          if ! python -m pip install --require-hashes --only-binary=:all: --no-cache-dir \
            -r scripts/siteops-build-requirements.txt > "$RUNNER_TEMP/release-tooling.log" 2>&1; then
            echo "::error::Release tooling could not be installed from the configured feed."
            exit 1
          fi

      - name: Prepare the immutable declaration
        id: plan
        shell: bash
        env:
          BEFORE_SHA: ${{ inputs.before-sha }}
          INTENT_PATH: ${{ inputs.intent }}
        run: |
          set -euo pipefail
          arguments=(--before-sha "$BEFORE_SHA")
          if [[ -n "$INTENT_PATH" ]]; then
            arguments=(--intent "$INTENT_PATH")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            arguments+=(--dry-run)
          fi
          python -B scripts/prepare-siteops-release.py \
            --repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --source-ref "$SOURCE_REF" --output-dir "$RUNNER_TEMP/release-plan" \
            "${arguments[@]}"
          python -c '
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              plan = json.load(stream)
          print("active=" + str(plan["active"]).lower())
          if plan["active"]:
              print("tag=" + plan["release"]["tag"])
              print("bundle=" + str(plan["siteops"]["bundle"]).lower())
              print("version-mode=" + (plan["siteops"]["versionMode"] or "build"))
          ' "$RUNNER_TEMP/release-plan/plan.json" >> "$GITHUB_OUTPUT"

      - name: Require configured publication reviewers
        if: ${{ !inputs.dry-run && steps.plan.outputs.active == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/siteops-release" \
            > "$RUNNER_TEMP/release-environment.json" 2> "$RUNNER_TEMP/release-environment.err"; then
            echo "::error::Cannot inspect the approval environment. Confirm access and Settings > Environments > siteops-release."
            exit 1
          fi
          python3 -c '
          import json, sys
          environment = json.load(open(sys.argv[1]))
          if not any(
              rule.get("type") == "required_reviewers" and rule.get("reviewers")
              for rule in environment.get("protection_rules", [])
          ):
              raise SystemExit("::error::In Settings > Environments, configure required reviewers for siteops-release.")
          ' "$RUNNER_TEMP/release-environment.json"

      - name: Retain the declaration and notes
        id: upload
        if: steps.plan.outputs.active == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-plan
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  distribution:
    name: Candidate installation
    needs: prepare
    if: needs.prepare.outputs.active == 'true' && needs.prepare.outputs.bundle == 'true'
    uses: ./.github/workflows/_siteops-distribution.yaml
    with:
      expected-source-sha: ${{ github.sha }}
      version-mode: ${{ needs.prepare.outputs.version-mode }}
      report-summary: false
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

  review:
    name: Prepare release summary
    needs: [prepare, distribution]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.active == 'true' &&
      ((needs.prepare.outputs.bundle == 'true' && needs.distribution.result == 'success') ||
       (needs.prepare.outputs.bundle == 'false' && needs.distribution.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_NUMBER: ${{ needs.distribution.outputs.build-number }}
      BUILD_ATTEMPT: ${{ needs.distribution.outputs.build-attempt }}
      BUILD_ARCHIVE_SHA: ${{ needs.distribution.outputs.archive-sha256 }}
      BUILD_WHEEL_NAME: ${{ needs.distribution.outputs.wheel-name }}
      BUILD_WHEEL_SHA: ${{ needs.distribution.outputs.wheel-sha256 }}
    outputs:
      plan-sha: ${{ steps.candidate.outputs.plan-sha }}
      bundle-sha: ${{ steps.candidate.outputs.bundle-sha }}
      wheel-name: ${{ steps.candidate.outputs.wheel-name }}
      wheel-sha: ${{ steps.candidate.outputs.wheel-sha }}
      asset-list-sha: ${{ steps.candidate.outputs.asset-list-sha }}
      engine-id: ${{ steps.candidate.outputs.engine-id }}
      engine-ref: ${{ steps.candidate.outputs.engine-ref }}
      notes-sha: ${{ steps.notes.outputs.sha256 }}
      notes-artifact-id: ${{ steps.notes-upload.outputs.artifact-id }}
      assets-artifact-id: ${{ steps.assets-upload.outputs.artifact-id }}
    steps:
      - name: Require successful CI for the candidate
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          python3 -c '
          import json, os, subprocess, time

          prefix = "repos/" + os.environ["GITHUB_REPOSITORY"]
          if os.environ.get("DRY_RUN") == "true":
              result = subprocess.run([
                  "gh", "api", prefix + "/actions/runs/" + os.environ["GITHUB_RUN_ID"] +
                  "/attempts/" + os.environ["GITHUB_RUN_ATTEMPT"] + "/jobs?per_page=100",
              ], capture_output=True, text=True, timeout=60)
              if result.returncode:
                  raise SystemExit("::error::GitHub could not read release-preview CI readiness.")
              jobs = json.loads(result.stdout).get("jobs", [])
              for name in ("Lint", "Unit Tests", "Validate Manifests"):
                  matches = [job for job in jobs if job.get("name") == name]
                  if len(matches) != 1 or matches[0].get("conclusion") != "success":
                      raise SystemExit("::error::The CI jobs must succeed before the release preview.")
              print("url=https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"])
              raise SystemExit(0)
          endpoint = "repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/workflows/ci.yaml/runs"
          deadline = time.monotonic() + 1800
          while True:
              result = subprocess.run([
                  "gh", "api", "--method", "GET", endpoint,
                  "-f", "head_sha=" + os.environ["SOURCE_SHA"], "-f", "per_page=100",
              ], capture_output=True, text=True, timeout=60)
              if result.returncode:
                  raise SystemExit("::error::GitHub could not read CI readiness for this candidate.")
              runs = [
                  run for run in json.loads(result.stdout).get("workflow_runs", [])
                  if run.get("head_sha") == os.environ["SOURCE_SHA"]
                  and run.get("path") == ".github/workflows/ci.yaml"
                  and run.get("event") in ("push", "workflow_dispatch")
                  and (run.get("repository") or {}).get("full_name") == os.environ["GITHUB_REPOSITORY"]
              ]
              run = max(runs, key=lambda item: item["id"]) if runs else None
              if run and run.get("status") == "completed":
                  if run.get("conclusion") != "success":
                      raise SystemExit("::error::The latest CI run for this commit did not succeed.")
                  print("url=" + run["html_url"])
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit("::error::No successful CI run became available. Run CI for the candidate commit.")
              time.sleep(20)
          ' >> "$GITHUB_OUTPUT"

      - name: Download the pinned declaration
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-plan
          merge-multiple: true
          digest-mismatch: error

      - name: Download the qualified release assets
        if: needs.prepare.outputs.bundle == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.distribution.outputs.staging-artifact-id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-bundle
          merge-multiple: true
          digest-mismatch: error

      - name: Verify the pinned candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          plan="$RUNNER_TEMP/release-plan/plan.json"
          python3 -c '
          import hashlib, json, os, re, sys, urllib.parse
          from pathlib import Path

          root = Path(sys.argv[1])
          raw = (root / "plan.json").read_bytes()
          if len(raw) > 1048576 or {p.name for p in root.iterdir()} != {"plan.json", "release-notes.md"}:
              raise SystemExit("::error::The candidate declaration inventory is invalid.")
          digest = hashlib.sha256(raw).hexdigest()
          plan = json.loads(raw)
          if (
              plan.get("apiVersion") != "siteops.release/v1"
              or plan.get("kind") != "ReleaseCandidate" or plan.get("active") is not True
              or plan.get("source") != {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "commit": os.environ["SOURCE_SHA"], "ref": os.environ["SOURCE_REF"]}
              or plan.get("dryRun") is not (os.environ.get("DRY_RUN") == "true")
              or (os.environ.get("DRY_RUN") != "true" and os.environ["SOURCE_REF"] != "refs/heads/main")
          ):
              raise SystemExit("::error::The candidate source identity is invalid.")
          release, engine, intent = plan["release"], plan["siteops"], plan["intent"]
          tag = release["tag"]
          if not isinstance(tag, str) or not re.fullmatch(r"(?:siteops/)?v[0-9][A-Za-z0-9.!_-]*", tag) or ".." in tag:
              raise SystemExit("::error::The release tag is invalid.")
          for value in (release["title"], release["version"]):
              if not isinstance(value, str) or not value or any(ord(c) < 32 or ord(c) == 127 for c in value):
                  raise SystemExit("::error::Release labels must be bounded single-line text.")
          if any(type(value) is not bool for value in (release["prerelease"], release["latest"], engine["bundle"])):
              raise SystemExit("::error::The candidate boolean fields are invalid.")
          if release["stream"] != ("siteops" if tag.startswith("siteops/") else "scalekit"):
              raise SystemExit("::error::The release stream and tag disagree.")
          if release["version"] != tag.removeprefix("siteops/").removeprefix("v"):
              raise SystemExit("::error::The release version and tag disagree.")
          if release["latest"] and (release["prerelease"] or release["stream"] != "scalekit"):
              raise SystemExit("::error::Only a stable content release can be marked latest.")
          if engine["bundle"] != (engine["versionMode"] in ("build", "source")):
              raise SystemExit("::error::The engine bundle mode is invalid.")
          parts = intent["path"].split("/")
          if os.environ.get("DRY_RUN") == "true" and parts[:2] == [".github", "release-examples"]:
              parts = ["releases", *parts[2:]]
          if len(parts) != 3 or parts[0] != "releases" or parts[1] in ("", ".", "..") or parts[2] != "release.json":
              raise SystemExit("::error::The declaration path is invalid.")
          if intent["notesPath"] != intent["path"].removesuffix("release.json") + "notes.md":
              raise SystemExit("::error::The release notes path is invalid.")
          for value in (intent["sha256"], intent["notesSha256"]):
              if not isinstance(value, str) or not re.fullmatch("[0-9a-f]{64}", value):
                  raise SystemExit("::error::The declaration digest is invalid.")
          if hashlib.sha256((root / "release-notes.md").read_bytes()).hexdigest() != intent["notesSha256"]:
              raise SystemExit("::error::The release notes differ from the declaration.")
          for key, value in {
              "plan-sha": digest, "tag": tag, "title": release["title"],
              "prerelease": str(release["prerelease"]).lower(), "latest": str(release["latest"]).lower(),
              "bundle": str(engine["bundle"]).lower(),
              "engine-tag": engine["releaseTag"] or "",
              "intent-path": urllib.parse.quote(intent["path"], safe="/"),
              "notes-path": urllib.parse.quote(intent["notesPath"], safe="/"),
          }.items():
              print(key + "=" + value)
          ' "$RUNNER_TEMP/release-plan" >> "$GITHUB_OUTPUT"

          # Both the original declaration and the current intent must match.
          # Advancing main without changing this intent does not change its candidate.
          for revision in "$SOURCE_SHA" "$SOURCE_REF"; do
            intent_path="$(python3 -c 'import json,sys,urllib.parse; print(urllib.parse.quote(json.load(open(sys.argv[1]))["intent"]["path"], safe="/"))' "$plan")"
            notes_path="$(python3 -c 'import json,sys,urllib.parse; print(urllib.parse.quote(json.load(open(sys.argv[1]))["intent"]["notesPath"], safe="/"))' "$plan")"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/$intent_path?ref=$revision" > "$RUNNER_TEMP/source-intent.json"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/$notes_path?ref=$revision" > "$RUNNER_TEMP/source-notes.md"
            python3 -c '
          import hashlib, json, re, sys
          from pathlib import Path
          plan = json.loads(Path(sys.argv[1]).read_text())
          for field, path in (("sha256", sys.argv[2]), ("notesSha256", sys.argv[3])):
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != plan["intent"][field]:
                  raise SystemExit("::error::The release file or notes changed. Prepare and review a new candidate.")
          declaration = json.loads(Path(sys.argv[2]).read_text())
          release, engine = plan["release"], plan["siteops"]
          if declaration["tag"] != release["tag"] or declaration.get("latest", False) != release["latest"]:
              raise SystemExit("::error::The plan disagrees with the reviewed declaration.")
          if release["stream"] == "siteops":
              valid = (
                  "siteops" not in declaration and engine["bundle"] is True
                  and engine["versionMode"] == "source" and engine["baseVersion"] == release["version"]
                  and engine["releaseTag"] is None
              )
          elif declaration["siteops"] == {"build": True}:
              valid = (
                  release["prerelease"] is True and engine["bundle"] is True
                  and engine["versionMode"] == "build" and engine["releaseTag"] is None
              )
          else:
              valid = (
                  declaration["siteops"] == {"release": engine["releaseTag"]}
                  and engine["bundle"] is False and engine["versionMode"] is None
                  and engine["baseVersion"] is None
                  and isinstance(engine["releaseTag"], str)
                  and re.fullmatch(r"siteops/v[0-9][A-Za-z0-9.!_-]*", engine["releaseTag"]) is not None
              )
          if not valid:
              raise SystemExit("::error::The engine selection disagrees with the reviewed declaration.")
            ' "$plan" "$RUNNER_TEMP/source-intent.json" "$RUNNER_TEMP/source-notes.md"
          done

          bundle="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["siteops"]["bundle"]).lower())' "$plan")"
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          if [[ "$bundle" == "true" ]]; then
            archive="$RUNNER_TEMP/release-bundle/$ARCHIVE_NAME"
            archive_proof="${archive}${ATTESTATION_SUFFIX}"
            if [[ ! "$BUILD_WHEEL_NAME" =~ ^siteops-[0-9A-Za-z][0-9A-Za-z.!+_~-]*-py3-none-any\.whl$ || "$BUILD_WHEEL_NAME" == *".."* ]]; then
              echo "::error::The standalone wheel filename is invalid."
              exit 1
            fi
            wheel="$RUNNER_TEMP/release-bundle/$BUILD_WHEEL_NAME"
            wheel_proof="${wheel}${ATTESTATION_SUFFIX}"
            gh attestation verify "$archive" --bundle "$archive_proof" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$SIGNER_IDENTITY" --signer-digest "$SOURCE_SHA" \
              --source-digest "$SOURCE_SHA" --source-ref "$SOURCE_REF" \
              --cert-oidc-issuer "$OIDC_ISSUER" \
              --predicate-type "$PREDICATE_TYPE" --deny-self-hosted-runners
            gh attestation verify "$wheel" --bundle "$wheel_proof" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$SIGNER_IDENTITY" --signer-digest "$SOURCE_SHA" \
              --source-digest "$SOURCE_SHA" --source-ref "$SOURCE_REF" \
              --cert-oidc-issuer "$OIDC_ISSUER" \
              --predicate-type "$PREDICATE_TYPE" --deny-self-hosted-runners
            python3 -c '
          import hashlib, json, os, re, sys, zipfile
          from pathlib import Path

          plan_path, bundle_path, output_path = map(Path, sys.argv[1:])
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          archive_name = os.environ["ARCHIVE_NAME"]
          wheel_name = os.environ["BUILD_WHEEL_NAME"]
          suffix = os.environ["ATTESTATION_SUFFIX"]
          expected_names = [archive_name, archive_name + suffix, wheel_name, wheel_name + suffix]
          entries = list(bundle_path.iterdir())
          if (
              sorted(entry.name for entry in entries) != sorted(expected_names)
              or any(entry.is_symlink() or not entry.is_file() for entry in entries)
              or len({entry.name for entry in entries}) != 4
          ):
              raise SystemExit("::error::The staged release asset inventory is invalid.")
          paths = {name: bundle_path / name for name in expected_names}
          if any(paths[name].stat().st_size == 0 for name in (archive_name + suffix, wheel_name + suffix)):
              raise SystemExit("::error::A staged attestation proof is empty.")

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          archive_digest = digest(paths[archive_name])
          wheel_digest = digest(paths[wheel_name])
          if archive_digest != os.environ["BUILD_ARCHIVE_SHA"]:
              raise SystemExit("::error::The archive differs from the qualified bytes.")
          if wheel_digest != os.environ["BUILD_WHEEL_SHA"]:
              raise SystemExit("::error::The wheel differs from the qualified bytes.")
          with zipfile.ZipFile(paths[archive_name]) as archive:
              if archive.namelist().count("bundle.json") != 1:
                  raise SystemExit("::error::The bundle manifest inventory is invalid.")
              manifest = json.loads(archive.read("bundle.json"))
              wheel_path = "wheels/" + wheel_name
              if archive.namelist().count(wheel_path) != 1:
                  raise SystemExit("::error::The bundle does not contain the standalone wheel.")
              if archive.read(wheel_path) != paths[wheel_name].read_bytes():
                  raise SystemExit("::error::The standalone wheel differs from the wheel in the bundle.")
          engine = plan["siteops"]
          expected = engine["baseVersion"]
          if engine["versionMode"] == "build":
              expected += "+build." + os.environ["BUILD_NUMBER"] + "." + os.environ["BUILD_ATTEMPT"] + ".g" + os.environ["SOURCE_SHA"][:12]
          if (
              manifest.get("apiVersion") != "siteops.install/v1" or manifest.get("kind") != "SiteOpsBundle"
              or manifest.get("source") != plan["source"]
              or manifest.get("build") != {"number": int(os.environ["BUILD_NUMBER"]), "attempt": int(os.environ["BUILD_ATTEMPT"])}
              or manifest.get("package", {}).get("name") != "siteops"
              or manifest.get("package", {}).get("version") != expected
              or manifest.get("package", {}).get("wheel") != "wheels/" + wheel_name
          ):
              raise SystemExit("::error::The bundle does not describe the selected candidate.")
          asset_list = {
              "apiVersion": "siteops.release.assets/v1",
              "kind": "SiteOpsReleaseAssets",
              "mode": "publish",
              "source": plan["source"],
              "assets": [
                  {"name": name, "sha256": digest(paths[name])}
                  for name in expected_names
              ],
          }
          output_path.write_text(
              json.dumps(asset_list, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print("engine-version=" + expected)
          print("bundle-sha=" + archive_digest)
          print("wheel-name=" + wheel_name)
          print("wheel-sha=" + wheel_digest)
            ' "$plan" "$RUNNER_TEMP/release-bundle" "$assets/release-assets.json" >> "$GITHUB_OUTPUT"
          else
            engine_tag="$(python3 -c 'import json,sys,urllib.parse; print(urllib.parse.quote(json.load(open(sys.argv[1]))["siteops"]["releaseTag"], safe=""))' "$plan")"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$engine_tag" > "$RUNNER_TEMP/engine-release.json"
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$engine_tag" > "$RUNNER_TEMP/engine-ref.json"
            python3 -c '
          import json, os, re, sys
          from pathlib import Path

          plan, release, ref = [json.load(open(path)) for path in sys.argv[1:4]]
          if release.get("draft") is not False or release.get("tag_name") != plan["siteops"]["releaseTag"]:
              raise SystemExit("::error::The referenced Site Ops release is not published.")
          archive = os.environ["ARCHIVE_NAME"]
          suffix = os.environ["ATTESTATION_SUFFIX"]
          values = release.get("assets", [])
          if not isinstance(values, list) or len(values) != 4:
              raise SystemExit("::error::The referenced Site Ops release has no complete native asset set.")
          by_name = {asset.get("name"): asset for asset in values if isinstance(asset, dict)}
          wheels = [
              name for name in by_name
              if isinstance(name, str)
              and re.fullmatch(r"siteops-[0-9A-Za-z][0-9A-Za-z.!+_~-]*-py3-none-any\.whl", name)
              and ".." not in name
          ]
          if len(wheels) != 1:
              raise SystemExit("::error::The referenced Site Ops release has an invalid wheel inventory.")
          wheel = wheels[0]
          names = [archive, archive + suffix, wheel, wheel + suffix]
          if set(by_name) != set(names):
              raise SystemExit("::error::The referenced Site Ops release has no complete native asset set.")
          assets = []
          for name in names:
              asset = by_name[name]
              digest = asset.get("digest")
              if asset.get("state") != "uploaded" or not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit("::error::The referenced Site Ops release asset identity is incomplete.")
              assets.append({"name": name, "sha256": digest.removeprefix("sha256:")})
          identity_value = release.get("id")
          target = ref.get("object", {}).get("sha")
          if not isinstance(identity_value, int) or identity_value <= 0:
              raise SystemExit("::error::The referenced Site Ops release identity is invalid.")
          identity = str(identity_value)
          if not isinstance(target, str) or not re.fullmatch(r"[0-9a-f]{40}", target):
              raise SystemExit("::error::The referenced Site Ops tag target is invalid.")
          asset_list = {
              "apiVersion": "siteops.release.assets/v1",
              "kind": "SiteOpsReleaseAssets",
              "mode": "reference",
              "engine": {
                  "releaseId": identity,
                  "tag": plan["siteops"]["releaseTag"],
                  "target": target,
              },
              "assets": assets,
          }
          Path(sys.argv[4]).write_text(
              json.dumps(asset_list, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print("engine-id=" + identity)
          print("engine-ref=" + target)
          print("wheel-name=" + wheel)
          print("wheel-sha=" + by_name[wheel]["digest"].removeprefix("sha256:"))
            ' "$plan" "$RUNNER_TEMP/engine-release.json" "$RUNNER_TEMP/engine-ref.json" "$assets/release-assets.json" >> "$GITHUB_OUTPUT"
          fi
          python3 -c '
          import hashlib, sys
          print("asset-list-sha=" + hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())
          ' "$assets/release-assets.json" >> "$GITHUB_OUTPUT"

      - name: Render the final release notes
        id: notes
        shell: bash
        env:
          ENGINE_VERSION: ${{ steps.candidate.outputs.engine-version }}
        run: |
          set -euo pipefail
          python3 -c '
          import hashlib, json, os, sys, urllib.parse
          from pathlib import Path
          root = Path(sys.argv[1])
          plan = json.loads((root / "release-plan/plan.json").read_text())
          notes = (root / "release-plan/release-notes.md").read_text(encoding="utf-8").rstrip() + "\n"
          source, engine = plan["source"], plan["siteops"]
          repository = source["repository"]
          home = "https://github.com/" + repository
          notes += "\n## Install Site Ops\n\n"
          if not engine["bundle"]:
              tag = engine["releaseTag"]
              url = home + "/releases/tag/" + urllib.parse.quote(tag, safe="")
              notes += "Use [" + tag + "](" + url + ") and its installation instructions. "
              notes += "The referenced engine release has its own source commit and native installation assets.\n"
          else:
              version = os.environ["ENGINE_VERSION"]
              archive = os.environ["ARCHIVE_NAME"]
              archive_proof = archive + os.environ["ATTESTATION_SUFFIX"]
              asset_list = json.loads((root / "release-assets/release-assets.json").read_text(encoding="utf-8"))
              wheels = [item["name"] for item in asset_list["assets"] if item["name"].endswith(".whl")]
              if asset_list.get("mode") != "publish" or len(wheels) != 1:
                  raise SystemExit("::error::The release asset list cannot render installation guidance.")
              wheel = wheels[0]
              wheel_proof = wheel + os.environ["ATTESTATION_SUFFIX"]
              downloads = home + "/releases/download/" + urllib.parse.quote(plan["release"]["tag"], safe="") + "/"
              guide = home + "/blob/" + source["commit"] + "/docs/install-siteops.md#install-the-verified-bundle"
              notes += "Package version: `" + version + "`.\n\n"
              notes += "**Prerequisites:** standard 64-bit CPython 3.10-3.14 and pipx 1.17.2. "
              notes += "Use Windows x64 or Linux x64 with glibc 2.17 or newer. "
              notes += "Configure an approved package index that serves the runtime dependencies as wheels.\n\n"
              wheel_url = downloads + wheel
              command = (
                  "pipx install \"" + wheel_url + "\" --backend pip --fetch-python never "
                  "--skip-maintenance --app siteops "
                  "--pip-args \"--only-binary=:all: --no-cache-dir\""
              )
              notes += "Install the versioned wheel from this release. Runtime dependencies come from your configured package index as wheels. "
              notes += "To name it explicitly, add `--index-url <your approved index>` inside `--pip-args`.\n\n"
              notes += "```console\n" + command + "\n```\n\n"
              notes += "To replace an existing online installation, review any pipx pin and rerun the command with `--force`. "
              notes += "Confirm the result with `siteops --version` and `siteops --help`.\n\n"
              notes += "pipx does not automatically verify GitHub attestations for the online command. "
              notes += "For external verification before extraction and a hash-locked native install from stable private storage, "
              notes += "follow the [verified installation guide](" + guide + "). "
              notes += "That path downloads only the ZIP and its detached proof, authenticates the ZIP before extraction, "
              notes += "then installs from the authenticated `pylock.toml` with stock pipx.\n\n"
              notes += "Expected publisher: `" + repository + "`. Source commit: `" + source["commit"] + "`. "
              notes += "Source ref: `" + source["ref"] + "`. "
              notes += "Use these values with the guide verification policy. "
              notes += "The guide also describes switching between online and locked installations.\n\n"
              notes += "The locked path is qualified with pipx 1.17.2 and its shared pip 26.2.1. "
              notes += "pip support for `pylock.toml` remains experimental.\n\n"
              notes += "Release assets: [" + wheel + "](" + wheel_url + "), "
              notes += "[" + wheel_proof + "](" + downloads + wheel_proof + "), "
              notes += "[" + archive + "](" + downloads + archive + "), and "
              notes += "[" + archive_proof + "](" + downloads + archive_proof + "). "
              notes += "Use these assets instead of the generated source archives.\n\n"
              notes += "Installing the CLI does not authenticate to Azure or deploy resources.\n"
          raw = notes.encode("utf-8")
          digest = hashlib.sha256(raw).hexdigest()
          (root / "publish-notes.md").write_bytes(raw)
          print("sha256=" + digest)
          ' "$RUNNER_TEMP" >> "$GITHUB_OUTPUT"

      - name: Check the publication target
        id: target
        shell: bash
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          python3 -c '
          import json, os, re, subprocess, sys, urllib.parse

          def request(path):
              result = subprocess.run(["gh", "api", path, "--include"], capture_output=True, text=True)
              header, separator, body = result.stdout.partition("\n\n")
              first = header.splitlines()[0] if header else ""
              if re.fullmatch(r"HTTP/\S+ 404(?: .*)?", first):
                  return None
              if result.returncode or not separator:
                  raise SystemExit("::error::GitHub could not confirm the publication target.")
              return json.loads(body)

          prefix = "repos/" + os.environ["GITHUB_REPOSITORY"]
          tag = urllib.parse.quote(os.environ["TAG"], safe="")
          if request(prefix + "/releases/tags/" + tag) is not None:
              raise SystemExit("::error::This release already exists. Existing releases are not overwritten.")
          ref = request(prefix + "/git/ref/tags/" + tag)
          if ref is None:
              print("tag-exists=false")
              raise SystemExit(0)
          target = ref["object"]
          for _ in range(8):
              if target["type"] == "commit":
                  break
              if target["type"] != "tag" or not re.fullmatch("[0-9a-f]{40}", target["sha"]):
                  raise SystemExit("::error::The existing tag has an unsupported target.")
              obj = request(prefix + "/git/tags/" + target["sha"])
              if obj is None:
                  raise SystemExit("::error::The existing tag object is unavailable.")
              target = obj["object"]
          if target["type"] != "commit" or target["sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit("::error::The tag points to another commit. Tags are never moved.")
          print("tag-exists=true")
          ' >> "$GITHUB_OUTPUT"

      - name: Retain the final release notes
        id: notes-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-notes.md
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Retain the frozen asset list
        id: assets-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets/release-assets.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Show the release approval preview
        shell: bash
        env:
          BUNDLE_SHA: ${{ steps.candidate.outputs.bundle-sha }}
          WHEEL_NAME: ${{ steps.candidate.outputs.wheel-name }}
          WHEEL_SHA: ${{ steps.candidate.outputs.wheel-sha }}
          ASSET_LIST_SHA: ${{ steps.candidate.outputs.asset-list-sha }}
          TAG_EXISTS: ${{ steps.target.outputs.tag-exists }}
          ENGINE_VERSION: ${{ steps.candidate.outputs.engine-version }}
          CI_URL: ${{ steps.ci.outputs.url }}
          MATRIX: ${{ needs.distribution.outputs.qualification-matrix }}
          ARTIFACT_URL: ${{ needs.distribution.outputs.staging-artifact-url }}
        run: |
          set -euo pipefail
          python3 -c '
          import json, os, re, sys
          from pathlib import Path

          def embedded_notes(text):
              lines = text.splitlines()
              headings = {}
              omitted = set()
              fence = None
              previous_text = False
              for index, line in enumerate(lines):
                  marker = re.match(r"^ {0,3}(`{3,}|~{3,})(.*)$", line)
                  if fence:
                      if marker and marker[1][0] == fence[0] and len(marker[1]) >= fence[1] and not marker[2].strip():
                          fence = None
                      previous_text = False
                      continue
                  if marker:
                      fence = (marker[1][0], len(marker[1]))
                      previous_text = False
                      continue
                  heading = re.match(r"^( {0,3})(#{1,6})(?=[ \t]|$)(.*)$", line)
                  if heading:
                      headings[index] = (len(heading[2]), heading[1], heading[3])
                  elif previous_text and re.fullmatch(r" {0,3}(=+|-+)[ \t]*", line):
                      headings[index - 1] = (1 if line.lstrip().startswith("=") else 2, "", " " + lines[index - 1].strip())
                      omitted.add(index)
                  previous_text = bool(
                      line.strip() and not heading
                      and not re.match(r"^( {4}|\t| {0,3}(?:>|<|[-+*] |[0-9]+[.)] ))", line)
                      and not re.fullmatch(r" {0,3}(?:=+|-+|(?:[-*_][ \t]*){3,})[ \t]*", line)
                      and index not in omitted
                  )
              shift = max(0, 3 - min((value[0] for value in headings.values()), default=3))
              for index, (level, indent, content) in headings.items():
                  lines[index] = indent + "#" * min(6, level + shift) + content
              return "\n".join(line for index, line in enumerate(lines) if index not in omitted)

          root = Path(sys.argv[1])
          plan = json.loads((root / "plan.json").read_text())
          release, engine = plan["release"], plan["siteops"]
          dry_run = os.environ.get("DRY_RUN") == "true"
          action = "Reuse the matching tag" if os.environ["TAG_EXISTS"] == "true" else "Create the missing tag"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("# Release preview (no publication)\n\n" if dry_run else "# Ready for release approval\n\n")
              if dry_run:
                  output.write("Preview only. No tag, GitHub Release, or approval request was created.\n\n")
              for label, value in (
                  ("Release", release["tag"]), ("Source commit", plan["source"]["commit"]),
                  ("Release file", plan["intent"]["path"]),
                  ("Stream", release["stream"]), ("Prerelease", release["prerelease"]),
                  ("Latest", release["latest"]), ("Proposed tag action" if dry_run else "Tag action", action),
                  ("Site Ops", engine["releaseTag"] or os.environ["ENGINE_VERSION"]),
              ):
                  output.write(f"- {label}: `{value}`\n")
              if engine["bundle"]:
                  matrix = json.loads(os.environ["MATRIX"])
                  expected = ["3.10", "3.11", "3.12", "3.13", "3.14"]
                  if not isinstance(matrix, list) or [row.get("python") for row in matrix] != expected:
                      raise SystemExit("::error::Incomplete installation qualification summary.")
                  output.write("\n## Installation checks\n\n| Python | Linux | Windows |\n|---|---|---|\n")
                  allowed = {"passed", "failed", "cancelled", "skipped", "not-run", "unknown"}
                  for row in matrix:
                      if row["python"] not in ("3.10", "3.11", "3.12", "3.13", "3.14") or row["linux"] not in allowed or row["windows"] not in allowed:
                          raise SystemExit("::error::Invalid qualification summary.")
                      output.write("| " + row["python"] + " | " + row["linux"] + " | " + row["windows"] + " |\n")
                  output.write("\n[Download the attested release assets](" + os.environ["ARTIFACT_URL"] + ")\n")
                  output.write("\nThe Actions download contains the installation ZIP, standalone wheel, and a detached proof for each. For a verified installation, use the ZIP and its proof.\n")
                  output.write("\n<details><summary>Artifact identity</summary>\n\n")
                  output.write("- `" + os.environ["ARCHIVE_NAME"] + "` SHA-256: `" + os.environ["BUNDLE_SHA"] + "`\n")
                  output.write("- `" + os.environ["WHEEL_NAME"] + "` SHA-256: `" + os.environ["WHEEL_SHA"] + "`\n")
                  output.write("- Frozen asset list SHA-256: `" + os.environ["ASSET_LIST_SHA"] + "`\n\n</details>\n")
              output.write("\nCI passed for this candidate. Installation qualification passed when a bundle is included.\n")
              output.write("CI evidence: " + os.environ["CI_URL"] + "\n")
              output.write("For content releases, confirm the applicable content/AIO evidence before approving.\n")
              if dry_run:
                  output.write("Next: review this preview. A declaration merged under releases/ starts the real approval flow.\n")
              else:
                  output.write("Next: select Review deployments, then siteops-release, then Approve and deploy.\n")
                  output.write("Approval authorizes the listed tag action at this commit and publication of these release assets.\n")
              if engine["bundle"]:
                  output.write("\nThe installation guidance below is for the published release. To try a candidate before publication, use the Actions download above and the installation guide for manually downloaded files.\n")
              output.write("\n## Release notes\n\n" + embedded_notes((root.parent / "publish-notes.md").read_text(encoding="utf-8")) + "\n")
          ' "$RUNNER_TEMP/release-plan"
