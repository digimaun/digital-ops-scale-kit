apiVersion: siteops.inputs/v1
kind: SiteInputContract
siteDefaults:
  properties:
    deployOptions:
      enableGlobalSite: false
      enableEdgeSite: false
      enableSecretSync: false
  parameters:
    brokerConfig:
      memoryProfile: Medium
    defaultDataflowInstanceCount: 1
inputs:
  - name: siteName
    type: string
    description: Name for this Site and its AIO resources.
    sitePath: name
  - name: subscription
    type: string
    description: Subscription containing the existing Arc cluster and resource group.
    sitePath: subscription
  - name: resourceGroup
    type: string
    description: Existing resource group containing the Arc cluster.
    sitePath: resourceGroup
  - name: location
    type: string
    description: Azure region of the existing Arc cluster.
    sitePath: location
  - name: clusterName
    type: string
    description: Name of the existing Arc-connected Kubernetes cluster.
    sitePath: parameters.clusterName
  - name: environment
    type: string
    description: Environment label applied to deployed resources, such as dev or prod.
    sitePath: labels.environment
  - name: country
    type: string
    description: Country label applied to deployed resources.
    sitePath: labels.country
  - name: aioRelease
    type: string
    description: AIO release configuration selected by this workspace.
    sitePath: properties.aioRelease
    default: "2608"
  - name: enableCertManager
    type: boolean
    description: Install the cert-manager Arc extension.
    sitePath: properties.deployOptions.enableCertManager
    default: true
