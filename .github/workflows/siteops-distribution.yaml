# Produces one attested and qualified Site Ops installation bundle from an exact
# commit. Dispatch it on the ref you intend to distribute and pass that ref's
# commit as `expected-source-sha`. The value is asserted against the event
# commit, so it selects nothing and can only stop a build of the wrong revision.
#
# Release declarations prepare their own candidate through release.yaml.

name: Site Ops Distribution

on:
  workflow_dispatch:
    inputs:
      expected-source-sha:
        description: "Full 40 character commit this ref is expected to resolve to"
        required: true
        type: string

permissions:
  contents: read

jobs:
  distribute:
    name: Distribute
    uses: ./.github/workflows/_siteops-distribution.yaml
    with:
      expected-source-sha: ${{ inputs.expected-source-sha }}
    # The called workflow scopes each job further. The build job keeps
    # `contents: read` alone, and only the attestation job signs.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
