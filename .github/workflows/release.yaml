# Publication consumes the frozen candidate after required environment approval.
name: Release (approval required)

on:
  push:
    branches: [main]
    paths:
      - "releases/**/release.json"
      - "releases/**/notes.md"
  workflow_dispatch:
    inputs:
      release-file:
        description: "Reviewed releases/<name>/release.json on main. This starts a real release candidate."
        required: true
        type: string
      expected-source-sha:
        description: "Full expected commit of main for this new candidate"
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}
  SOURCE_REF: ${{ github.ref }}
  ARCHIVE_NAME: siteops-install.zip
  ATTESTATION_SUFFIX: .attestation.jsonl
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  PREDICATE_TYPE: https://slsa.dev/provenance/v1
  SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/_siteops-distribution.yaml@${{ github.ref }}

jobs:
  candidate:
    name: Prepare release candidate
    uses: ./.github/workflows/_release-candidate.yaml
    with:
      expected-source-sha: ${{ github.event_name != 'workflow_dispatch' && github.sha || inputs.expected-source-sha }}
      intent: ${{ inputs.release-file || '' }}
      before-sha: ${{ github.event.before || '' }}
      dry-run: false
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

  publish:
    name: Approve tag creation and publication
    needs: candidate
    if: needs.candidate.result == 'success' && needs.candidate.outputs.active == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ needs.candidate.outputs.tag }}
      cancel-in-progress: false
    environment: siteops-release
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVED_PLAN_SHA: ${{ needs.candidate.outputs.plan-sha }}
      APPROVED_NOTES_SHA: ${{ needs.candidate.outputs.notes-sha }}
      APPROVED_BUNDLE_SHA: ${{ needs.candidate.outputs.bundle-sha }}
      APPROVED_ENGINE_ID: ${{ needs.candidate.outputs.engine-id }}
      APPROVED_ENGINE_REF: ${{ needs.candidate.outputs.engine-ref }}
    steps:
      - name: Download the pinned declaration
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.plan-artifact-id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-plan
          merge-multiple: true
          digest-mismatch: error

      - name: Download the reviewed release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.notes-artifact-id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-notes
          merge-multiple: true
          digest-mismatch: error

      - name: Download the qualified bundle
        if: needs.candidate.outputs.bundle == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.bundle-artifact-id }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-bundle
          merge-multiple: true
          digest-mismatch: error

      - name: Verify the approved candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -c '
          import hashlib, json, os, subprocess, sys, urllib.parse
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          raw = (root / "release-plan/plan.json").read_bytes()
          notes = (root / "release-notes/publish-notes.md").read_bytes()
          if (
              hashlib.sha256(raw).hexdigest() != os.environ["APPROVED_PLAN_SHA"]
              or hashlib.sha256(notes).hexdigest() != os.environ["APPROVED_NOTES_SHA"]
          ):
              raise SystemExit("::error::The candidate or notes differ from the approved preview.")
          plan = json.loads(raw)
          if (
              plan.get("dryRun") is not False or plan.get("active") is not True
              or plan.get("apiVersion") != "siteops.release/v1"
              or plan.get("kind") != "ReleaseCandidate"
              or plan.get("source") != {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "commit": os.environ["SOURCE_SHA"], "ref": "refs/heads/main"}
              or os.environ["SOURCE_REF"] != "refs/heads/main"
          ):
              raise SystemExit("::error::Only the approved main-branch candidate can be published.")

          def read(path):
              result = subprocess.run(["gh", "api", path], capture_output=True, timeout=60)
              if result.returncode:
                  raise SystemExit("::error::GitHub could not recheck the approved source.")
              return json.loads(result.stdout)

          prefix = "repos/" + os.environ["GITHUB_REPOSITORY"]
          for path_key, hash_key in (("path", "sha256"), ("notesPath", "notesSha256")):
              path = urllib.parse.quote(plan["intent"][path_key], safe="/")
              result = subprocess.run([
                  "gh", "api", "-H", "Accept: application/vnd.github.raw+json",
                  prefix + "/contents/" + path + "?ref=refs/heads/main",
              ], capture_output=True, timeout=60)
              if result.returncode or hashlib.sha256(result.stdout).hexdigest() != plan["intent"][hash_key]:
                  raise SystemExit("::error::The release file or notes changed. Prepare and review a new candidate.")
          release, engine = plan["release"], plan["siteops"]
          if not engine["bundle"]:
              tag = urllib.parse.quote(engine["releaseTag"], safe="")
              linked = read(prefix + "/releases/tags/" + tag)
              ref = read(prefix + "/git/ref/tags/" + tag)
              required = {os.environ["ARCHIVE_NAME"], os.environ["ARCHIVE_NAME"] + os.environ["ATTESTATION_SUFFIX"]}
              if (
                  str(linked.get("id")) != os.environ["APPROVED_ENGINE_ID"]
                  or linked.get("draft") is not False or linked.get("tag_name") != engine["releaseTag"]
                  or ref.get("object", {}).get("sha") != os.environ["APPROVED_ENGINE_REF"]
                  or not required.issubset({asset.get("name") for asset in linked.get("assets", [])})
              ):
                  raise SystemExit("::error::The referenced engine release changed after approval.")
          for key, value in {
              "tag": release["tag"], "title": release["title"],
              "prerelease": str(release["prerelease"]).lower(),
              "latest": str(release["latest"]).lower(), "bundle": str(engine["bundle"]).lower(),
          }.items():
              print(key + "=" + value)
          ' >> "$GITHUB_OUTPUT"

      - name: Verify the approved bundle
        if: needs.candidate.outputs.bundle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/release-bundle/$ARCHIVE_NAME"
          if [[ "$(sha256sum "$archive" | cut -d ' ' -f 1)" != "$APPROVED_BUNDLE_SHA" ]]; then
            echo "::error::The bundle differs from the approved bytes."
            exit 1
          fi
          gh attestation verify "$archive" --bundle "${archive}${ATTESTATION_SUFFIX}" \
            --repo "$GITHUB_REPOSITORY" --cert-identity "$SIGNER_IDENTITY" \
            --signer-digest "$SOURCE_SHA" --source-digest "$SOURCE_SHA" --source-ref "$SOURCE_REF" \
            --cert-oidc-issuer "$OIDC_ISSUER" --predicate-type "$PREDICATE_TYPE" --deny-self-hosted-runners

      - name: Check the publication target
        id: target
        shell: bash
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          python3 -c '
          import json, os, re, subprocess, sys, urllib.parse

          def request(path):
              result = subprocess.run(["gh", "api", path, "--include"], capture_output=True, text=True)
              header, separator, body = result.stdout.partition("\n\n")
              first = header.splitlines()[0] if header else ""
              if re.fullmatch(r"HTTP/\S+ 404(?: .*)?", first):
                  return None
              if result.returncode or not separator:
                  raise SystemExit("::error::GitHub could not confirm the publication target.")
              return json.loads(body)

          prefix = "repos/" + os.environ["GITHUB_REPOSITORY"]
          tag = urllib.parse.quote(os.environ["TAG"], safe="")
          if request(prefix + "/releases/tags/" + tag) is not None:
              raise SystemExit("::error::This release already exists. Existing releases are not overwritten.")
          ref = request(prefix + "/git/ref/tags/" + tag)
          if ref is None:
              print("tag-exists=false")
              raise SystemExit(0)
          target = ref["object"]
          for _ in range(8):
              if target["type"] == "commit":
                  break
              if target["type"] != "tag" or not re.fullmatch("[0-9a-f]{40}", target["sha"]):
                  raise SystemExit("::error::The existing tag has an unsupported target.")
              obj = request(prefix + "/git/tags/" + target["sha"])
              if obj is None:
                  raise SystemExit("::error::The existing tag object is unavailable.")
              target = obj["object"]
          if target["type"] != "commit" or target["sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit("::error::The tag points to another commit. Tags are never moved.")
          print("tag-exists=true")
          ' >> "$GITHUB_OUTPUT"

      - name: Create only the approved missing tag
        if: steps.target.outputs.tag-exists == 'false'
        shell: bash
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          umask 077
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_SHA" \
            > "$RUNNER_TEMP/created-tag.json" 2> "$RUNNER_TEMP/create-tag.err"; then
            echo "::error::The tag could not be created. Inspect the target before retrying."
            exit 1
          fi
          python3 -c '
          import json, os, sys
          ref = json.load(open(sys.argv[1]))
          if ref.get("ref") != "refs/tags/" + os.environ["TAG"] or ref.get("object", {}).get("sha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("::error::GitHub did not confirm the requested tag.")
          ' "$RUNNER_TEMP/created-tag.json"

      - name: Publish the approved release
        shell: bash
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
          TITLE: ${{ steps.candidate.outputs.title }}
          PRERELEASE: ${{ steps.candidate.outputs.prerelease }}
          LATEST: ${{ steps.candidate.outputs.latest }}
          BUNDLE: ${{ steps.candidate.outputs.bundle }}
        run: |
          set -euo pipefail
          assets=()
          if [[ "$BUNDLE" == "true" ]]; then
            assets=("$RUNNER_TEMP/release-bundle/$ARCHIVE_NAME" "$RUNNER_TEMP/release-bundle/${ARCHIVE_NAME}${ATTESTATION_SUFFIX}")
          fi
          gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/release-notes/publish-notes.md" \
            "--prerelease=$PRERELEASE" "--latest=$LATEST"

      - name: Confirm published assets and immutability
        shell: bash
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
          PRERELEASE: ${{ steps.candidate.outputs.prerelease }}
          BUNDLE: ${{ steps.candidate.outputs.bundle }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/published-release.json"
          immutable="$(python3 -c '
          import hashlib, json, os, sys
          from pathlib import Path
          release = json.load(open(sys.argv[1]))
          expected = {}
          if os.environ["BUNDLE"] == "true":
              for name in (os.environ["ARCHIVE_NAME"], os.environ["ARCHIVE_NAME"] + os.environ["ATTESTATION_SUFFIX"]):
                  path = Path(os.environ["RUNNER_TEMP"]) / "release-bundle" / name
                  expected[name] = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
          if (
              release.get("tag_name") != os.environ["TAG"] or release.get("draft") is not False
              or release.get("prerelease") != (os.environ["PRERELEASE"] == "true")
              or {asset["name"]: asset.get("digest") for asset in release.get("assets", [])} != expected
              or any(asset.get("state") != "uploaded" for asset in release.get("assets", []))
              or type(release.get("immutable")) is not bool
          ):
              raise SystemExit("::error::The published release does not match the approved request.")
          print(str(release["immutable"]).lower())
          ' "$RUNNER_TEMP/published-release.json")"
          if [[ "$immutable" == "true" ]]; then
            gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"
            if [[ "$BUNDLE" == "true" ]]; then
              gh release verify-asset "$TAG" "$RUNNER_TEMP/release-bundle/$ARCHIVE_NAME" --repo "$GITHUB_REPOSITORY"
              gh release verify-asset "$TAG" "$RUNNER_TEMP/release-bundle/${ARCHIVE_NAME}${ATTESTATION_SUFFIX}" --repo "$GITHUB_REPOSITORY"
            fi
          fi
          {
            echo "## Published release"
            echo ""
            echo "- [Open release $TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Immutable: \`$immutable\`"
          } >> "$GITHUB_STEP_SUMMARY"
