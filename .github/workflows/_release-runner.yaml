name: _Release Runner

on:
  workflow_call:
    inputs:
      expected-source-sha:
        required: true
        type: string
      mode:
        required: true
        type: string
    outputs:
      pool:
        value: ${{ jobs.select.outputs.pool }}
      labels:
        value: ${{ jobs.select.outputs.labels }}

permissions:
  contents: read

jobs:
  select:
    name: Admit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      pool: ${{ steps.select.outputs.pool }}
      labels: ${{ steps.select.outputs.labels }}
    steps:
      - name: Admit the release runner request
        id: select
        shell: python
        env:
          RELEASE_PROVENANCE_READY: ${{ vars.SITEOPS_RELEASE_PROVENANCE_READY }}
          RELEASE_POOL: ${{ vars.SITEOPS_RELEASE_POOL }}
          RELEASE_IMAGE: ${{ vars.SITEOPS_RELEASE_IMAGE }}
          RUNNER_MODE: ${{ vars.SITEOPS_RELEASE_RUNNER_MODE }}
          RELEASE_MODE: ${{ inputs.mode }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_IS_FORK: ${{ github.event.repository.fork }}
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
          CALLER_EVENT: ${{ github.event_name }}
        run: |
          import json
          import os
          import re

          def reject(message):
              raise SystemExit("::error::" + message)

          mode = os.environ["RELEASE_MODE"]
          ref = os.environ["SOURCE_REF"]
          event = os.environ["CALLER_EVENT"]
          expected = os.environ["EXPECTED_SOURCE_SHA"]
          if not re.fullmatch("[0-9a-f]{40}", expected) or expected != os.environ["SOURCE_SHA"]:
              reject("Select the full current source commit before requesting release runners.")
          workflow = {"check": "ci.yaml", "attestation": "ci.yaml", "preview": "ci.yaml", "release": "release.yaml"}.get(mode)
          if workflow is None or os.environ["CALLER_WORKFLOW"] != (
              os.environ["SOURCE_REPOSITORY"] + "/.github/workflows/" + workflow + "@" + ref
          ):
              reject("Release runners require the supported CI or Release entry point.")
          if mode in {"check", "attestation", "preview"}:
              if event != "workflow_dispatch" or not ref.startswith("refs/heads/"):
                  reject("Release previews require an explicit dispatch from a reviewed branch.")
          elif event not in {"push", "workflow_dispatch"} or ref != "refs/heads/main":
              reject("Publication candidates require a push or explicit dispatch on main.")
          if mode == "attestation" and os.environ["SOURCE_IS_FORK"] != "true":
              reject("The non-release attestation diagnostic requires a fork repository.")
          pool = os.environ["RELEASE_POOL"]
          if not re.fullmatch("[A-Za-z0-9][A-Za-z0-9._-]{0,99}", pool):
              reject("Configure SITEOPS_RELEASE_POOL with this repository's dedicated 1ES pool name.")
          runner_mode = os.environ["RUNNER_MODE"] or "legacy"
          if runner_mode not in {"legacy", "scaleset"}:
              reject("SITEOPS_RELEASE_RUNNER_MODE must be legacy or scaleset.")
          if mode == "attestation" and runner_mode != "scaleset":
              reject("The attestation diagnostic requires the qualified Scale Set routing.")
          labels = [pool]
          if mode == "check" and runner_mode == "legacy":
              image = os.environ["RELEASE_IMAGE"]
              if not re.fullmatch("[A-Za-z0-9][A-Za-z0-9._-]{0,99}", image):
                  reject("Configure SITEOPS_RELEASE_IMAGE with an approved image name in the selected pool.")
              labels = ["self-hosted", "1ES.Pool=" + pool, "1ES.ImageOverride=" + image]
          if mode not in {"check", "attestation"} and os.environ["RELEASE_PROVENANCE_READY"] != "true":
              reject(
                  "1ES release artifact execution is not enabled. Configure "
                  "SITEOPS_RELEASE_PROVENANCE_READY=true after reviewing this repository's "
                  "runner configuration and provenance policy."
              )
          if mode not in {"check", "attestation"} and runner_mode != "scaleset":
              reject("Release artifact execution requires SITEOPS_RELEASE_RUNNER_MODE=scaleset.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("pool=" + pool + "\n")
              if mode in {"check", "attestation"}:
                  output.write("labels=" + json.dumps(labels, separators=(",", ":")) + "\n")
          if runner_mode == "scaleset":
              print("Scale Set runner checks use only the pool name and its configured image.")
          print("The configured 1ES pool was selected for this request. Test runners are unchanged.")

  probe:
    name: Tools
    needs: select
    if: inputs.mode == 'check'
    runs-on: ${{ fromJSON(needs.select.outputs.labels) }}
    timeout-minutes: 10
    permissions: {}
    outputs:
      boot-session: ${{ steps.probe.outputs.boot-session }}
    steps:
      - name: Inspect baseline tools without source or credentials
        id: probe
        shell: python
        env:
          RUNNER_CLASS: ${{ runner.environment }}
        run: |
          import hashlib
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          if sys.platform != "linux" or os.environ["RUNNER_CLASS"] != "self-hosted" or sys.version_info < (3, 10):
              raise SystemExit("::error::The check requires the configured Linux 1ES runner.")
          boot = Path("/proc/sys/kernel/random/boot_id").read_text().strip()
          if not re.fullmatch("[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}", boot):
              raise SystemExit("::error::A bounded worker boot identity is required.")
          salt = os.environ["GITHUB_RUN_ID"] + ":" + os.environ["GITHUB_RUN_ATTEMPT"]
          session = hashlib.sha256((salt + ":" + boot).encode()).hexdigest()
          with tempfile.TemporaryDirectory(prefix="siteops-runner-check-", dir=os.environ["RUNNER_TEMP"]) as temporary:
              environment = {
                  "PATH": os.environ["PATH"], "HOME": temporary,
                  "AZURE_CONFIG_DIR": str(Path(temporary) / "azure"),
                  "GH_CONFIG_DIR": str(Path(temporary) / "github"),
                  "AZURE_CORE_COLLECT_TELEMETRY": "false",
                  "AZURE_EXTENSION_USE_DYNAMIC_INSTALL": "no",
                  "GH_PROMPT_DISABLED": "1", "LC_ALL": "C.UTF-8",
              }
              versions = [("Python", ".".join(map(str, sys.version_info[:3])))]
              commands = (
                  ("git", ("--version",), r"git version ([0-9]+\.[0-9]+\.[0-9]+)"),
                  ("gh", ("--version",), r"gh version ([0-9]+\.[0-9]+\.[0-9]+)"),
                  ("az", ("version", "--query", '"azure-cli"', "--output", "tsv"), r"([0-9]+\.[0-9]+\.[0-9]+)"),
              )
              for tool, arguments, pattern in commands:
                  executable = shutil.which(tool)
                  if executable is None:
                      raise SystemExit("::error::The maintained image must provide " + tool + ".")
                  try:
                      result = subprocess.run(
                          [executable, *arguments], cwd=temporary, env=environment,
                          stdin=subprocess.DEVNULL, capture_output=True, text=True, timeout=30,
                      )
                  except (OSError, subprocess.TimeoutExpired):
                      raise SystemExit("::error::The baseline tool check could not complete for " + tool + ".") from None
                  version = re.match(pattern, result.stdout)
                  if result.returncode or len(result.stdout) > 32768 or version is None:
                      raise SystemExit("::error::The baseline tool returned an unsupported version result: " + tool + ".")
                  if tool == "gh" and tuple(map(int, version[1].split("."))) < (2, 95, 0):
                      raise SystemExit("::error::GitHub CLI 2.95 or newer is required for release verification.")
                  versions.append((tool, version[1]))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("boot-session=" + session + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## 1ES runner baseline\n\n| Tool | Version |\n|---|---|\n")
              for tool, version in versions:
                  output.write("| " + tool + " | " + version + " |\n")
              output.write("\nNo source was checked out, no artifact was built or signed, and no cloud resources were requested.\n")

  recheck:
    name: Session
    needs: [select, probe]
    if: inputs.mode == 'check'
    runs-on: ${{ fromJSON(needs.select.outputs.labels) }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Compare job boot sessions without publishing machine identities
        shell: python
        env:
          PREVIOUS_BOOT_SESSION: ${{ needs.probe.outputs.boot-session }}
          RUNNER_CLASS: ${{ runner.environment }}
        run: |
          import hashlib
          import os
          import re
          import sys
          from pathlib import Path

          if sys.platform != "linux" or os.environ["RUNNER_CLASS"] != "self-hosted":
              raise SystemExit("::error::The check requires the configured Linux 1ES runner.")
          previous = os.environ["PREVIOUS_BOOT_SESSION"]
          boot = Path("/proc/sys/kernel/random/boot_id").read_text().strip()
          if not re.fullmatch("[0-9a-f]{64}", previous) or not re.fullmatch("[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}", boot):
              raise SystemExit("::error::Both job boot identities are required.")
          salt = os.environ["GITHUB_RUN_ID"] + ":" + os.environ["GITHUB_RUN_ATTEMPT"]
          current = hashlib.sha256((salt + ":" + boot).encode()).hexdigest()
          if current == previous:
              raise SystemExit("::error::Both jobs used the same worker boot session.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(
                  "## Worker session check\n\nThe two jobs used different boot sessions.\n\n"
                  "This observation is not attestation evidence and does not establish Trusted Launch, "
                  "complete machine isolation or release readiness. This diagnostic does not change release admission.\n"
              )
